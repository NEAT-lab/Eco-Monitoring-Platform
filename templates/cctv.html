<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">home</a></li>
                <li><a href="/detect">detect</a></li>
                <li><a href="/cctv">cctv</a></li>
                <li><a href="/panorama">panorama</a></li>
            </ul>
        </nav>
    </header>

    <h2>溫溼度監測</h2>

    <div>溫度：<span id="temp">--</span> °C</div>
    <div>濕度：<span id="hum">--</span> %</div>
    <div>時間：<span id="time">--</span></div>

    <script>
    async function updateData() {
        const res = await fetch("/api/data");
        const data = await res.json();

        temp.innerText = data.temperature ?? "--";
        hum.innerText  = data.humidity ?? "--";
        time.innerText = data.timestamp ?? "--";
    }

    setInterval(updateData, 1000);
    updateData();
    </script>

</body>
</html>
