<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">

    <title>NCKU NEAT LAB</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="../static/images/neat_logo.jpg" width="50" height="50">

            </div>
            <ul>
                <li><a href="/">home</a></li>
                <li><a href="/detect">detect</a></li>
