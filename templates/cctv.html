<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCKU NEAT LAB</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="../static/images/neat_logo.jpg" alt="NEAT LAB Logo">
                <span>NEAT LAB</span>
            </div>
            <ul>
                <li><a href="/">home</a></li>
                <li><a href="/detect">detect</a></li>
                <li><a href="/cctv">cctv</a></li>
                <li><a href="/panorama">panorama</a></li>
            </ul>
        </nav>
    </header>

    <div id="main-container">
        <div id="video-section">
            <h2>即時環境監測</h2>
            <div id="control_section">
                <div id="control_section_left">
                    <h3>Camera 1</h3>
                    <div id="zoom_control">
                        <label>Zoom: <span id="zoomDisplay">----</span></label>
                        <input type="range" id="zoomSlider" min="1" max="9999" value="">
                        <div id="zoomStatus">就緒</div>
                    </div>
                    <img id="rtsp_test" alt="RTSP Feed 1">
                </div>
                <div id="control_section_right">
                    <h3>Camera 2</h3>
                    <div id="camera2_controls">                        
                        <div id="direction-control">
                            <button id="upBtn">上</button>
                            <button id="downBtn">下</button>
                            <button id="leftBtn">左</button>
                            <button id="rightBtn">右</button>
                            <div id="directionStatus">就緒</div>
                        </div>
                        <div id="zoom_control_2">
                            <label>Zoom: <span id="zoomDisplay_2">----</span></label>
                            <input type="range" id="zoomSlider_2" min="1" max="9999" value="">
                            <div id="zoomStatus_2">就緒</div>
                        </div>                        
                    </div>
                    <img id="rtsp_test_2" alt="RTSP Feed 2">
                </div>
            </div>
        </div>
        
        <h2>YOLO識別結果 (每1分鐘更新一次)</h2>
        <div id="detection-section" style="display: flex; gap: 20px; margin-top: 20px;">
            <div id="detection_cam1" style="flex: 1; border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="margin: 0;">Camera 1 識別結果</h3>
                    <button id="manualDetect_cam1" style="padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">手動識別</button>
                </div>
                <div id="detection1_status" style="margin-bottom: 10px; font-size: 14px; color: #666;">準備中...</div>
                <img id="detection_image_cam1" alt="Camera 1 Detection Result" style="max-width: 100%; max-height: 400px; display: none; border-radius: 8px;">
                <div id="detection1_placeholder" style="width: 100%; height: 300px; background-color: #f0f0f0; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
                    <p style="color: #999;">等待第一次識別結果...</p>
                </div>
            </div>
            <div id="detection_cam2" style="flex: 1; border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="margin: 0;">Camera 2 識別結果</h3>
                    <button id="manualDetect_cam2" style="padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">手動識別</button>
                </div>
                <div id="detection2_status" style="margin-bottom: 10px; font-size: 14px; color: #666;">準備中...</div>
                <img id="detection_image_cam2" alt="Camera 2 Detection Result" style="max-width: 100%; max-height: 400px; display: none; border-radius: 8px;">
                <div id="detection2_placeholder" style="width: 100%; height: 300px; background-color: #f0f0f0; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
                    <p style="color: #999;">等待第一次識別結果...</p>
                </div>
            </div>
        </div>
        
        <h3>鳥類活動統計</h3>
        <div id="chart-section">
            <!-- 日期控制列 -->
            <div id="chart-controls">
                <button id="btnPrev">◀ 前一天</button>
                <input type="date" id="datePicker">
                <button id="btnNext">後一天 ▶</button>
                <button id="btnToday" style="background-color: #28a745;">回到今天</button>
            </div>
            <div class="chart-box">
                <canvas id="birdChart"></canvas>
            </div>
        </div>
        <div class="image-section" style="margin-top: 30px; text-align: center;">
            <p>點擊上方長條圖以查看該時段照片</p>
            <h3 id="imageTitle"></h3>
            <!-- 預設隱藏圖片，等有點擊或載入時才顯示 -->
            <div id="imageContainer">
                <img id="recordImage" src="" alt="尚無該時段照片"
                    style="max-width: 100%; display: none; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
                <p id="noImageText" style="color: #666;">(尚無照片)</p>
            </div>
        </div>
        <main id="sensor-section">
            <h3 id="raspberry">neat raspberry 溫溼度監測</h3>

            <div id="temperature" class="upload-box">溫度：<span id="temp">--</span> °C</div>
            <div id="humidity" class="upload-box">濕度：<span id="hum">--</span> %</div>
            <div id="timestamp" class="upload-box">時間：<span id="time">--</span></div>

            <script src="../static/cctv.js"></script>
        </main>
    </div>
</body>

</html>
